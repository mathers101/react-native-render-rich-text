# Publishes the public package to npmjs when a version tag is pushed.
#
# npm trusted publishing (OIDC). No NPM_TOKEN. The package settings on
# npmjs.com must name this workflow file: publish.yml
# https://docs.npmjs.com/trusted-publishers
#
# Yarn 4 is required. Yarn 1 refuses workspaces when "private" is false.
#
# Cut a release by bumping "version" in package.json, committing it, then:
#   git tag vX.Y.Z
#   git push origin vX.Y.Z

name: Publish

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Require the tag to match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            echo "Commit the version bump, then tag that commit as v${version}."
            exit 1
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Parser tests
        run: yarn test:parser

      - name: Publish
        run: |
          # setup-node writes an empty _authToken placeholder. npm treats that
          # as a configured login and skips the trusted-publisher OIDC exchange.
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            grep -v '_authToken=' "$npmrc" > "${npmrc}.new" || true
            mv "${npmrc}.new" "$npmrc"
          fi
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm."
          else
            npm publish --access public
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
