# Publishes the public package to npmjs when a version tag is pushed.
#
# Repository secret NPM_TOKEN must be an npm automation token that can
# publish @mathers101. Anyone can install the package. No token is required.
#
# Yarn 4 is required. Yarn 1 refuses workspaces when "private" is false.
#
# Cut a release by bumping "version" in package.json, committing it, then:
#   git tag vX.Y.Z
#   git push origin vX.Y.Z

name: Publish

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Require the tag to match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            echo "Commit the version bump, then tag that commit as v${version}."
            exit 1
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Parser tests
        run: yarn test:parser

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "The NPM_TOKEN repository secret is empty."
            echo "Create an npm automation token that can publish @mathers101 and add it as NPM_TOKEN."
            exit 1
          fi
          # setup-node stores //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # before this step's secret exists, so npm sees an empty login.
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          mkdir -p "$(dirname "$npmrc")"
          touch "$npmrc"
          grep -v '//registry.npmjs.org/:_authToken=' "$npmrc" > "${npmrc}.new" || true
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "${npmrc}.new"
          mv "${npmrc}.new" "$npmrc"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm."
          else
            npm publish --access public --registry https://registry.npmjs.org
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
