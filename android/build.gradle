buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0"
  }
}

apply plugin: "com.android.library"

def shouldApplyKotlinPlugin() {
  def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
  if (agpMajor <= 8) {
    return true
  }
  if (agpMajor >= 10) {
    return false
  }
  def propertyVal = providers.gradleProperty("android.builtInKotlin").orNull
  def builtInKotlinEnabled = propertyVal != null ? propertyVal.toBoolean() : true
  return !builtInKotlinEnabled
}

if (shouldApplyKotlinPlugin()) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

def getExtOrDefault = { name, fallback ->
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "com.renderrichtext"
  compileSdkVersion getExtOrDefault("compileSdkVersion", 37)

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 24)
    targetSdkVersion getExtOrDefault("targetSdkVersion", 36)
    consumerProguardFiles "consumer-rules.pro"
    buildConfigField "boolean", "ENABLE_MATH", "false"
    buildConfigField "boolean", "ENABLE_VIDEO", "false"
    buildConfigField "boolean", "ENABLE_CODE_HIGHLIGHT", "false"
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      java.srcDirs += ["generated/java", "generated/jni"]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
}

react {
  jsRootDir = file("../src/")
  libraryName = "RichTextSpec"
  codegenJavaPackageName = "com.renderrichtext"
}
