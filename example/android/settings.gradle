pluginManagement {
    // Yarn workspaces hoist dependencies to the repository root, so the plugin
    // is not always under example/node_modules. pluginManagement only resolves
    // plugins from a relative includeBuild path.
    def pluginPath = "../node_modules/@react-native/gradle-plugin"
    if (!file(pluginPath).exists()) {
        pluginPath = "../../node_modules/@react-native/gradle-plugin"
    }
    includeBuild(pluginPath)

  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}
plugins { id("com.facebook.react.settings") 
id("expo-autolinking-settings")
}
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand) }
rootProject.name = 'RenderRichTextExample'

// Resolve autolinked project dirs through any Yarn/Windows symlink so Kotlin
// incremental compilation sees the same path the editor saves to.
gradle.settingsEvaluated {
    rootProject.children.each { proj ->
        proj.projectDir = proj.projectDir.canonicalFile
    }
}
include ':app'
expoAutolinking.useExpoModules()
expoAutolinking.useExpoVersionCatalog()
includeBuild(expoAutolinking.reactNativeGradlePlugin)
